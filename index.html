<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanier College — Board of Governors · Motion Archive</title>
  <style>
    /* ── Theme tokens ─────────────────────────────────────────── */
    :root {
      --primary:        #8B0000;
      --primary-h:      #a50000;
      --primary-d:      #6d0000;
      --bg:             #ffffff;
      --bg-alt:         #f6f6f6;
      --bg-card:        #ffffff;
      --text:           #1a1a1a;
      --text-muted:     #606060;
      --border:         #e0e0e0;
      --shadow:         rgba(0,0,0,0.07);
      --row-hover:      #fff4f4;
      --row-stripe:     #fafafa;
      --tag-bg:         #efefef;
      --tag-text:       #4a4a4a;
      --mark-bg:        #ffe082;
      --mark-text:      #3d2e00;
    }
    [data-theme="dark"] {
      --bg:             #111111;
      --bg-alt:         #1c1c1c;
      --bg-card:        #222222;
      --text:           #e6e6e6;
      --text-muted:     #999999;
      --border:         #303030;
      --shadow:         rgba(0,0,0,0.35);
      --row-hover:      #2a1212;
      --row-stripe:     #181818;
      --tag-bg:         #2d2d2d;
      --tag-text:       #bbb;
      --mark-bg:        #7d5a00;
      --mark-text:      #ffe082;
    }

    /* ── Reset ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ─────────────────────────────────────────────────── */
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 15px;
      transition: background .2s, color .2s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      flex-shrink: 0;
    }
    .hdr-branding {
      display: flex;
      align-items: center;
      gap: .9rem;
    }
    .hdr-crest {
      width: 46px;
      height: 46px;
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .hdr-text h1 {
      font-size: clamp(.95rem, 2.5vw, 1.3rem);
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.2;
    }
    .hdr-text .sub {
      font-size: .75rem;
      opacity: .78;
      margin-top: .15rem;
      letter-spacing: .03em;
    }
    .theme-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      border-radius: 7px;
      padding: .35rem .85rem;
      font-size: .8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      flex-shrink: 0;
    }
    .theme-btn:hover { background: rgba(255,255,255,.28); }

    /* ── Main ─────────────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
    }

    /* ── Stat cards ───────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: .9rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.15rem .9rem;
      box-shadow: 0 1px 5px var(--shadow);
      border-top: 3px solid var(--primary);
      transition: transform .15s, box-shadow .15s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px var(--shadow);
    }
    .stat-label {
      font-size: .67rem;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text-muted);
      font-weight: 700;
    }
    .stat-value {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      margin: .25rem 0 .15rem;
      font-variant-numeric: tabular-nums;
    }
    .stat-sub {
      font-size: .7rem;
      color: var(--text-muted);
    }

    /* ── Controls bar ─────────────────────────────────────────── */
    .controls {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .9rem 1.15rem;
      margin-bottom: 1.1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: flex-end;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }
    .ctrl-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-muted);
    }
    .ctrl-group select,
    .ctrl-group input[type="search"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: .42rem .8rem;
      font-size: .85rem;
      height: 36px;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0;
    }
    #searchInput { width: 260px; }
    #filterCategory, #filterRouting { width: 160px; }
    .ctrl-group select:focus,
    .ctrl-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139,0,0,.12);
    }
    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 7px;
      padding: .42rem .9rem;
      font-size: .8rem;
      cursor: pointer;
      height: 36px;
      transition: border-color .15s, color .15s;
      align-self: flex-end;
      white-space: nowrap;
    }
    .btn-clear:hover { border-color: var(--primary); color: var(--primary); }
    .results-count {
      margin-left: auto;
      align-self: flex-end;
      font-size: .78rem;
      color: var(--text-muted);
      white-space: nowrap;
      padding-bottom: .25rem;
    }

    /* ── Table ────────────────────────────────────────────────── */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 1px 5px var(--shadow);
      overflow: hidden;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .835rem;
      min-width: 820px;
    }
    thead { position: sticky; top: 0; z-index: 10; }
    th {
      background: var(--primary);
      color: #fff;
      padding: .65rem 1rem;
      text-align: left;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-weight: 700;
      white-space: nowrap;
      user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { background: var(--primary-h); }
    .sort-icon {
      display: inline-block;
      margin-left: .3rem;
      font-size: .6rem;
      opacity: .6;
    }
    th.sort-asc  .sort-icon { opacity: 1; }
    th.sort-desc .sort-icon { opacity: 1; }

    td {
      padding: .65rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { background: var(--bg); transition: background .1s; }
    tbody tr:nth-child(even) { background: var(--row-stripe); }
    tbody tr:hover { background: var(--row-hover); }

    /* Date col */
    .col-date { white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 80px; }

    /* Category badge */
    .badge {
      display: inline-block;
      padding: .18rem .55rem;
      border-radius: 100px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-Construction { background: #fff3cd; color: #7d5a00; }
    .badge-Goods        { background: #d1ecf1; color: #0c5460; }
    .badge-Services     { background: #d4edda; color: #155724; }
    .badge-Approvals    { background: #e2d9f3; color: #4a2d7a; }
    .badge-Other        { background: #efefef; color: #444;    }
    [data-theme="dark"] .badge-Construction { background: #3d2e00; color: #ffc107; }
    [data-theme="dark"] .badge-Goods        { background: #003d44; color: #5bc8d7; }
    [data-theme="dark"] .badge-Services     { background: #1a3a20; color: #66bb6a; }
    [data-theme="dark"] .badge-Approvals    { background: #2d1f4a; color: #b39ddb; }
    [data-theme="dark"] .badge-Other        { background: #2d2d2d; color: #bbb;    }

    /* Routing badge */
    .rbadge {
      display: inline-block;
      padding: .15rem .45rem;
      border-radius: 5px;
      font-size: .67rem;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .rbadge-BOG { background: var(--primary); color: #fff; }
    .rbadge-EC  { background: #555; color: #fff; }

    /* Value */
    .col-value { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 130px; }

    /* Methods */
    .col-method { min-width: 120px; }
    .methods { display: flex; flex-wrap: wrap; gap: .28rem; }
    .m-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: .13rem .4rem;
      border-radius: 4px;
      font-size: .67rem;
      white-space: nowrap;
    }

    /* Description */
    .col-desc { max-width: 380px; min-width: 240px; line-height: 1.4; }
    .notes { font-size: .73rem; color: var(--text-muted); margin-top: .3rem; font-style: italic; }

    /* Highlight */
    mark { background: var(--mark-bg); color: var(--mark-text); border-radius: 2px; padding: 0 1px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      font-size: .9rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: .75rem; }

    /* ── Footer ───────────────────────────────────────────────── */
    footer {
      background: var(--bg-alt);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.1rem 1rem;
      font-size: .78rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    footer strong { color: var(--text); font-weight: 600; }
    .footer-updated { margin-top: .2rem; font-size: .72rem; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .theme-btn { align-self: flex-end; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .controls { flex-direction: column; align-items: stretch; }
      .ctrl-group select,
      .ctrl-group input[type="search"],
      #filterCategory,
      #filterRouting,
      #searchInput { width: 100%; }
      .results-count { margin-left: 0; }
    }
    @media (max-width: 380px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<header>
  <div class="hdr-branding">
    <div class="hdr-crest" aria-hidden="true">🏛</div>
    <div class="hdr-text">
      <h1>Vanier College — Board of Governors &middot; Motion Archive</h1>
      <div class="sub">Procurement &amp; Capital Projects Register</div>
    </div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle colour theme">☀ Light</button>
</header>

<main>
  <div class="stats-grid" id="statsGrid" aria-label="Summary statistics"></div>

  <div class="controls" role="search">
    <div class="ctrl-group">
      <span class="ctrl-label">Category</span>
      <select id="filterCategory" aria-label="Filter by category">
        <option value="">All categories</option>
        <option>Construction</option>
        <option>Goods</option>
        <option>Services</option>
        <option>Approvals</option>
        <option>Other</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Routed by</span>
      <select id="filterRouting" aria-label="Filter by routing body">
        <option value="">BOG &amp; EC</option>
        <option value="BOG">BOG only</option>
        <option value="EC">EC only</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Keyword search</span>
      <input type="search" id="searchInput" placeholder="Search descriptions, methods, notes…" autocomplete="off" aria-label="Keyword search">
    </div>
    <button class="btn-clear" id="btnClear" aria-label="Clear all filters">Clear</button>
    <div class="results-count" id="resultsCount" aria-live="polite"></div>
  </div>

  <div class="table-wrap" role="region" aria-label="Motions table">
    <table id="motionsTable" aria-label="Board of Governors motions">
      <thead>
        <tr>
          <th class="sortable" data-col="date" aria-sort="none">
            Date <span class="sort-icon" aria-hidden="true">⇅</span>
          </th>
          <th>Category</th>
          <th>Routing</th>
          <th class="sortable" data-col="value" aria-sort="none">
            Value <span class="sort-icon" aria-hidden="true">⇅</span>
          </th>
          <th>Method</th>
          <th>Description &amp; Notes</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<footer>
  <strong>Vanier College Procurement Services</strong>
  <div class="footer-updated">Last updated: May 21, 2026</div>
</footer>

/* ── Utilities ─────────────────────────────────────────────────── */
function fmtDate(d) {
  const [y, m] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[+m - 1] + ' ' + y;
}

function fmtMoney(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + n.toLocaleString('en-CA', {maximumFractionDigits: 0});
  return '$' + n.toFixed(2);
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function highlight(text, term) {
  if (!term) return esc(text);
  const safe = esc(text);
  const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(safeTerm, 'gi'), m => '<mark>' + m + '</mark>');
}

/* ── Stat cards ────────────────────────────────────────────────── */
function buildStats() {
  const total      = MOTIONS.length;
  const totalVal   = MOTIONS.reduce((s, m) => s + m.valueRaw, 0);
  const bogCount   = MOTIONS.filter(m => m.routing === 'BOG').length;
  const ecCount    = MOTIONS.filter(m => m.routing === 'EC').length;
  const catCounts  = {};
  MOTIONS.forEach(m => { catCounts[m.category] = (catCounts[m.category] || 0) + 1; });

  const constrVal  = MOTIONS.filter(m => m.category === 'Construction').reduce((s, m) => s + m.valueRaw, 0);
  const goodsVal   = MOTIONS.filter(m => m.category === 'Goods').reduce((s, m) => s + m.valueRaw, 0);
  const svcVal     = MOTIONS.filter(m => m.category === 'Services').reduce((s, m) => s + m.valueRaw, 0);

  const cards = [
    { label: 'Total Motions',     value: total,               sub: 'across all categories' },
    { label: 'Disclosed Value',   value: fmtMoney(totalVal),  sub: 'sum of reported figures' },
    { label: 'Board (BOG)',       value: bogCount,             sub: bogCount + ' of ' + total + ' motions' },
    { label: 'Exec. Cmte (EC)',   value: ecCount,              sub: ecCount + ' of ' + total + ' motions' },
    { label: 'Construction',      value: catCounts['Construction'] || 0, sub: fmtMoney(constrVal) + ' disclosed' },
    { label: 'Goods',             value: catCounts['Goods'] || 0,        sub: fmtMoney(goodsVal) + ' disclosed' },
    { label: 'Services',          value: catCounts['Services'] || 0,     sub: fmtMoney(svcVal) + ' disclosed' },
    { label: 'Approvals / Other', value: (catCounts['Approvals'] || 0) + (catCounts['Other'] || 0), sub: 'policy & budget items' },
  ];

  const grid = document.getElementById('statsGrid');
  grid.innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-label">${esc(c.label)}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${esc(c.sub)}</div>
    </div>`).join('');
}

/* ── Table rendering ────────────────────────────────────────────── */
let sortCol = 'date';
let sortDir = 'desc'; // newest first by default

function getFilteredSorted() {
  const cat    = document.getElementById('filterCategory').value;
  const route  = document.getElementById('filterRouting').value;
  const term   = document.getElementById('searchInput').value.trim().toLowerCase();

  let rows = MOTIONS.filter(m => {
    if (cat   && m.category !== cat)   return false;
    if (route && m.routing  !== route) return false;
    if (term) {
      const hay = [m.date, m.category, m.routing, m.valueDisplay,
                   m.method.join(' '), m.description, m.notes]
                  .join(' ').toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    let va, vb;
    if (sortCol === 'date') {
      va = a.date; vb = b.date;
      return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    } else {
      va = a.valueRaw; vb = b.valueRaw;
      return sortDir === 'asc' ? va - vb : vb - va;
    }
  });

  return rows;
}

function renderTable() {
  const term = document.getElementById('searchInput').value.trim();
  const rows = getFilteredSorted();
  const tbody = document.getElementById('tableBody');

  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">
      <div class="icon">🔍</div>
      No motions match the current filters.
    </td></tr>`;
    document.getElementById('resultsCount').textContent = '0 results';
    return;
  }

  const total = MOTIONS.length;
  document.getElementById('resultsCount').textContent =
    rows.length === total ? total + ' motions' : rows.length + ' of ' + total + ' motions';

  tbody.innerHTML = rows.map(m => {
    const methodTags = m.method.length
      ? '<div class="methods">' + m.method.map(t => `<span class="m-tag">${esc(t)}</span>`).join('') + '</div>'
      : '<span style="color:var(--text-muted);font-size:.75rem">—</span>';

    const notesHtml = m.notes
      ? `<div class="notes">${highlight(m.notes, term)}</div>`
      : '';

    return `<tr>
      <td class="col-date">${esc(fmtDate(m.date))}</td>
      <td><span class="badge badge-${esc(m.category)}">${esc(m.category)}</span></td>
      <td><span class="rbadge rbadge-${esc(m.routing)}">${esc(m.routing)}</span></td>
      <td class="col-value">${highlight(m.valueDisplay, term)}</td>
      <td class="col-method">${methodTags}</td>
      <td class="col-desc">${highlight(m.description, term)}${notesHtml}</td>
    </tr>`;
  }).join('');
}

/* ── Sort controls ──────────────────────────────────────────────── */
const SORT_ICONS = { asc: '▲', desc: '▼', none: '⇅' };

function updateSortHeaders() {
  document.querySelectorAll('th.sortable').forEach(th => {
    const col = th.dataset.col;
    th.classList.remove('sort-asc', 'sort-desc');
    const icon = th.querySelector('.sort-icon');
    if (col === sortCol) {
      th.classList.add('sort-' + sortDir);
      th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
      icon.textContent = SORT_ICONS[sortDir];
    } else {
      th.setAttribute('aria-sort', 'none');
      icon.textContent = SORT_ICONS.none;
    }
  });
}

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = col === 'date' ? 'desc' : 'desc';
    }
    updateSortHeaders();
    renderTable();
  });
});

/* ── Filter listeners ───────────────────────────────────────────── */
['filterCategory', 'filterRouting', 'searchInput'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
});

document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('filterCategory').value = '';
  document.getElementById('filterRouting').value  = '';
  document.getElementById('searchInput').value    = '';
  renderTable();
});

/* ── Dark mode ──────────────────────────────────────────────────── */
const html = document.documentElement;
const btn  = document.getElementById('themeBtn');

function applyTheme(dark) {
  html.setAttribute('data-theme', dark ? 'dark' : 'light');
  btn.textContent = dark ? '☾ Dark' : '☀ Light';
}

btn.addEventListener('click', () => {
  const isDark = html.getAttribute('data-theme') === 'dark';
  localStorage.setItem('vc-theme', isDark ? 'light' : 'dark');
  applyTheme(!isDark);
});

const saved = localStorage.getItem('vc-theme');
if (saved) {
  applyTheme(saved === 'dark');
} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  applyTheme(true);
}

/* ── Init ───────────────────────────────────────────────────────── */
buildStats();
updateSortHeaders();
renderTable();
</script>
